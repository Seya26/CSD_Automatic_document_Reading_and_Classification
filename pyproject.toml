[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albo-pipeline"
version = "0.1.0"
description = "Classification and field extraction for municipal acts published on the albo pretorio"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pymupdf>=1.24.3",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "streamlit>=1.40",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
